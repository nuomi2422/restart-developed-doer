version = "${version}"
displayName = "AC Execution Plugin"
authors = "dwinovo"
description = '''Host-independent AC execution layer: register host atomic tools, run and resume AC scripts, expose ac_execute/ac_status/ac_resume gates to the agent.'''

[[dependencies.ac]]
