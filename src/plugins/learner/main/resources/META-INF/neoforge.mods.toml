modLoader = "javafml"
loaderVersion = "${neoforge_loader_version_range}"
license = "${license}"

[[mods]]
modId = "learner"
version = "${version}"
displayName = "Learner"
authors = "dwinovo"
description = '''Learner: the working AI drops raw memos with an environment snapshot; the learner drains the queue, reviews each memo, and returns structured verdicts. Plan-only by design: it never submits body actions (single-driver red line RL-9).'''

[[dependencies.learner]]
modId = "numen_api"
type = "required"
versionRange = "[0.0,)"
ordering = "AFTER"
side = "BOTH"

[[dependencies.learner]]
modId = "neoforge"
type = "required"
versionRange = "[${neoforge_version},)"
ordering = "NONE"
side = "BOTH"

[[dependencies.learner]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"
