modLoader = "javafml"
loaderVersion = "${neoforge_loader_version_range}"
license = "${license}"

[[mods]]
modId = "settlement"
version = "${version}"
displayName = "Settlement Plugin"
authors = "dwinovo"
description = '''Base & facility module: register reusable facilities (pasture / farm / trade / house / storage), persist them independently of the 128-entry world-asset cap, and expose settlement_register / settlement_list / settlement_verify / settlement_unregister to the agent.'''

[[dependencies.settlement]]
modId = "numen_api"
type = "required"
versionRange = "[0.0,)"
ordering = "AFTER"
side = "BOTH"

[[dependencies.settlement]]
modId = "neoforge"
type = "required"
versionRange = "[${neoforge_version},)"
ordering = "NONE"
side = "BOTH"

[[dependencies.settlement]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"
