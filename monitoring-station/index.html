<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>RDD · Agent Context / 工具 / 任务链 / ACX / 经验携带器 / 实验统计</title>
  <link rel="stylesheet" href="css/reset.css?v=2">
  <link rel="stylesheet" href="css/theme.css?v=2">
  <link rel="stylesheet" href="css/monitoring.css?v=4">
  <!-- ★ 共享设计层：必须排在 monitoring.css 之后（同权重才覆盖得过它）。
       只改老页面的外观，不改任何 render 函数 / DOM 结构。理由见文件头。 -->
  <link rel="stylesheet" href="css/panel.css?v=1">
<link rel="stylesheet" href="css/experience-chain.css?v=3">
<link rel="stylesheet" href="css/experience-library.css?v=1">
<link rel="stylesheet" href="css/acx.css?v=3">
<link rel="stylesheet" href="css/token.css?v=1">
<link rel="stylesheet" href="css/experiment.css?v=1">
<link rel="stylesheet" href="css/skeleton.css?v=1">
</head>
<body>
  <main class="monitor-shell" id="monitor-shell">
    <header class="monitor-head">
      <div><div class="brand">RDD 监测台</div><div class="subtitle">六个分析区块 · 每一块再分子块 · 先看输入输出，再看任务安排与实际执行</div></div>
      <div class="connection-strip"><span id="adapter-dot" class="dot warn"></span><span id="adapter-status">等待日志</span><span id="rdd-dot" class="dot warn"></span><span id="rdd-status">RDD 未接入</span><span id="stream-badge" class="badge warn">等待连接</span></div>
    </header>
<!-- 一级：六个分析区块 + 一个脚手架区。内容由 js/monitor-nav.js 生成，
     这里只留空壳 —— 真源只有那一份，改导航就不改 HTML。 -->
    <nav class="zone-tabs" id="zone-tabs" aria-label="分析区块"></nav>
    <!-- 二级：当前区块的子块 -->
    <nav class="sub-tabs" id="sub-tabs" aria-label="子块"></nav>
    <!-- 当前子块的一句话说明。真源在 monitor-nav.js 的 sub.desc ——
         标题说是什么，desc 说为什么看它，这是让分析变清晰的那一句。 -->
    <div class="sub-gloss" id="sub-gloss"></div>
    <section class="monitor-toolbar">
      <span id="page-title">Supervisor 输入/输出</span>
      <span class="toolbar-spacer"></span>
      <button id="pause-btn" class="btn" title="暂停 / 恢复画面刷新。常驻数据仍进库：整块重建会丢视图状态，卸载任务链或展开折叠会被打回；暂停后画面保持，数据照收（各项封顶 500 条）">⏸ 暂停刷新</button>
      <span id="freeze-badge" class="badge warn" style="display:none">画面已冻结 · 数据仍在收</span>
      <label class="font-control" for="font-scale">字号 <select id="font-scale" aria-label="界面字号"><option value="normal">标准</option><option value="large" selected>大</option><option value="xlarge">特大</option></select></label>
      <span>最新优先 · 历史折叠</span>
      <a class="btn" href="/acx.html" target="_blank" rel="noopener" title="另一个前端，2 秒轮询一次，适合只看状态机时开着">ACX 独立页 ↗</a>
    </section>
    <!-- 内容区。page-body 装本子块的卡片；下面六个 host 常驻不销毁 ——
         chain-view / experience-chain-view / experience-library-view / acx-view
         / token-view / experiment-view 这六个 view 各自把内容写进自己的容器，
         容器被 innerHTML 抹掉等于把它的输出也扔掉（2026-10-03 之前那四个页签都是这么空白的）。 -->
    <section class="monitor-content" id="monitor-content" aria-live="polite">
      <div class="grid" id="page-body"></div>
      <div class="subview" id="chain-host" hidden></div>
      <div class="subview" id="experience-chain" hidden></div>
      <div class="subview" id="explib-host" hidden></div>
      <div class="subview" id="acx-host" hidden></div>
      <div class="subview" id="token-host" hidden></div>
      <div class="subview" id="experiment-host" hidden></div>
      <div class="subview" id="world-facts-host" hidden></div>
      <div class="subview" id="economy-host" hidden></div>
      <div class="subview" id="semantics-host" hidden></div>
    </section>
    <footer class="watchdog" id="watchdog"><span>观测时效</span><b id="watch-state" class="warn">未连接</b><span>新增 <i id="in-rate">0</i>/秒</span><span>显示记录 <i id="queue-depth">0</i></span><span>窗口淘汰 <i id="dropped">0</i></span><span>最后记录 <i id="last-event">—</i></span></footer>
  </main>
  <script src="js/monitor-store.js?v=3"></script>
  <script src="js/monitor-nav.js?v=1"></script>
  <script src="js/numen-adapter.js?v=2"></script>
  <script src="js/request-view.js?v=2"></script>
  <script src="js/rdd-view.js?v=9"></script>
  <!-- 这五个独立 view 必须排在 monitor-app.js **之前**（2026-10-03 踩过）：
       它们各自 fetch 自己的第一个数据集，monitor-app 启动时要 init 它们；
       而 init 得等它们先定义好。反过来排的话 monitor-app 的 window.X 守卫
       会把 init 整个跳过 —— 守卫分不清「还没加载」和「不该调」，
       结果就是 4.1~4.3 永远停在「正在读状态机记录…」。 -->
  <script src="js/chain-view.js?v=3"></script>
  <script src="js/experience-chain-view.js?v=5"></script>
  <script src="js/experience-library-view.js?v=2"></script>
  <script src="js/acx-view.js?v=5"></script>
  <!-- token-view 同理：它自己 fetch /api/token-rate，monitor-app 要 init 它。 -->
  <script src="js/token-view.js?v=1"></script>
  <!-- experiment-view 同理：它自己 fetch /api/experiment-stats，monitor-app 要 init 它。 -->
  <script src="js/experiment-view.js?v=1"></script>
  <!-- 3.6 语义资产（P0-C）：自己 fetch /api/rdd-semantics。 -->
  <script src="js/semantics-view.js?v=1"></script>
  <!-- ⑦ 世界与经济：两个骨架页，同样自己 fetch /api/world-facts 与 /api/economy。 -->
  <script src="js/world-facts-view.js?v=1"></script>
  <script src="js/economy-view.js?v=1"></script>
  <script src="js/monitor-app.js?v=9"></script>
</body>
</html>
