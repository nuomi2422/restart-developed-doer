<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>RDD Monitoring Station</title>
  <link rel="stylesheet" href="css/reset.css?v=2">
  <link rel="stylesheet" href="css/theme.css?v=2">
  <link rel="stylesheet" href="css/monitoring.css?v=2">
</head>
<body>
  <main class="monitor-shell" id="monitor-shell">
    <header class="monitor-head">
      <div><div class="brand">RDD MONITORING STATION</div><div class="subtitle">AUI / RDD · Newman · MC</div></div>
      <div class="connection-strip"><span id="adapter-dot" class="dot ok"></span><span id="adapter-status">Adapter MOCK</span><span id="rdd-dot" class="dot warn"></span><span id="rdd-status">RDD 未接入</span><span id="stream-badge" class="badge warn">WAITING FOR NUMEN</span></div>
    </header>
    <nav class="monitor-tabs" id="monitor-tabs" aria-label="监测分页">
      <button class="active" data-page="overview">总览</button><button data-page="ai">AI / Thinking</button><button data-page="context">Context</button><button data-page="tools">Tools</button><button data-page="ac">AC</button><button data-page="environment">环境</button><button data-page="health">健康</button><button data-page="intro">介绍</button><button data-page="docs">文档</button>
    </nav>
    <section class="monitor-toolbar"><span id="page-title">总览</span><span class="toolbar-spacer"></span><button id="btn-inject" class="btn" type="button">注入样例事件</button><button id="btn-clear" class="btn" type="button">清空当前页</button></section>
    <section class="monitor-content" id="monitor-content" aria-live="polite"></section>
    <footer class="watchdog" id="watchdog"><span>看门狗</span><b id="watch-state" class="good">STABLE</b><span>IN <i id="in-rate">0</i>/s</span><span>队列 <i id="queue-depth">0</i>/1000</span><span>丢弃 <i id="dropped">0</i></span><span>最后事件 <i id="last-event">—</i></span></footer>
  </main>
  <script src="js/monitor-store.js?v=2"></script>
  <script src="js/numen-adapter.js?v=1"></script>
  <script src="js/monitor-app.js?v=2"></script>
</body>
</html>
